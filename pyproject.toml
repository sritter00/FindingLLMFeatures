[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finding-llm-features"
version = "0.1.0"
description = "Finding latent features in LLM representations"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformer-lens>=1.0.0",
    "datasets>=2.14.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# uv configuration for this project
